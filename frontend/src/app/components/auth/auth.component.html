<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg">

    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        {{ isLoginMode ? 'Sign in to your account' : 'Create a new account' }}
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Document Management System
      </p>
    </div>

    <form class="mt-8 space-y-6" (submit)="onSubmit($event)">

      <div class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">
            Email address
          </label>
          <div class="mt-1">
            <input
              id="email"
              name="email"
              type="email"
              required
              placeholder="you@example.com"
              [class.border-red-300]="emailError"
              [class.text-red-900]="emailError"
              [class.focus:ring-red-500]="emailError"
              [class.focus:border-red-500]="emailError"
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors duration-200">
          </div>

          @if (emailError) {
            <p class="mt-2 text-sm text-red-600" id="email-error">
              {{ emailError }}
            </p>
          }
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">
            Password
          </label>
          <div class="mt-1">
            <input
              id="password"
              name="password"
              type="password"
              required
              placeholder="••••••••"
              [class.border-red-300]="passwordError"
              [class.text-red-900]="passwordError"
              [class.focus:ring-red-500]="passwordError"
              [class.focus:border-red-500]="passwordError"
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors duration-200">
          </div>

          @if (passwordError) {
            <p class="mt-2 text-sm text-red-600" id="password-error">
              {{ passwordError }}
            </p>
          }
        </div>
      </div>

      @if (generalError) {
        <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-4">
          <div class="flex">
            <div class="ml-3">
              <p class="text-sm text-red-700">
                {{ generalError }}
              </p>
            </div>
          </div>
        </div>
      }

      <div>
        <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
          {{ isLoginMode ? 'Sign In' : 'Register' }}
        </button>
      </div>
    </form>

    <div class="text-center mt-4">
      <button (click)="toggleMode()" type="button" class="text-sm text-blue-600 hover:text-blue-500 font-medium cursor-pointer focus:outline-none">
        {{ isLoginMode ? "Don't have an account? Register" : 'Already have an account? Sign in' }}
      </button>
    </div>
  </div>
</div>
